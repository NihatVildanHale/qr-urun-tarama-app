# Gradle JVM bellek ve performans ayarları
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# AndroidX ve Jetifier desteği (Modern Android kütüphaneleri için şarttır)
android.useAndroidX=true
android.enableJetifier=true

# Kotlin ve Gradle derleme optimizasyonları
kotlin.code.style=official
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# R8/Proguard kod sıkıştırma optimizasyonu
android.enableR8.fullMode=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
android.autoDownloadDependencies=false
android.builder.sdkDownload=false
